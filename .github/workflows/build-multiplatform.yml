name: Build Multiplatform

on:
  workflow_dispatch:
  push:
    branches:
      - ci/multiplatform-build

permissions:
  contents: read

jobs:
  build-linux-x64:
    name: Linux x64 (AppImage & deb)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: System Architecture and Environment Info
        run: |
          echo "=== Linux Runner Info ==="
          uname -a
          uname -m
          node -v || true
          npm -v || true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb \
            libnss3 \
            libatk-bridge2.0-0 \
            libgtk-3-0 \
            libxss1 \
            file \
            dpkg
          sudo apt-get install -y --no-install-recommends libasound2t64 || sudo apt-get install -y --no-install-recommends libasound2 || true
          sudo apt-get install -y --no-install-recommends libfuse2t64 || sudo apt-get install -y --no-install-recommends libfuse2 || true

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies (native ffmpeg-static for Linux x64)
        run: |
          cd backend
          npm ci
          cd ..

      - name: Validate GEMINI_API_KEY secret and write backend/.env
        env:
          GEMINI_SECRET: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_SECRET" ]; then
            echo "::error::El secret GEMINI_API_KEY no está configurado o está vacío en el repositorio."
            exit 1
          fi
          echo "::add-mask::$GEMINI_SECRET"
          mkdir -p backend
          printf "GEMINI_API_KEY=%s\nGEMINI_MODEL=gemini-2.0-flash\n" "$GEMINI_SECRET" > backend/.env
          chmod 600 backend/.env
          echo "backend/.env configurado correctamente (clave enmascarada)."

      - name: CI Compatibility & Static Syntax Check
        run: |
          echo "Verificando sintaxis de scripts de producción..."
          node --check electron/main.js
          node --check electron/preload.js
          node --check backend/src/server.js
          node --check backend/src/storage.js
          node --check backend/src/routes/auth.js
          node --check backend/src/routes/audio.js
          node --check backend/src/routes/export.js
          node --check backend/src/utils/audioMixer.js
          node --check backend/src/utils/audioTrimmer.js
          node --check .github/scripts/smoke-test.js
          echo "Sintaxis 100% verificada."

      - name: Build Linux x64 Packages (AppImage & deb)
        run: npm run build:linux:x64

      - name: Verify build artifacts exist and are non-empty
        run: |
          echo "=== Verificando archivos generados en dist/ ==="
          ls -la dist/
          APPIMAGE="dist/PodcastCraft-AI-1.1.0-linux-x64.AppImage"
          DEB="dist/PodcastCraft-AI-1.1.0-linux-x64.deb"

          if [ ! -f "$APPIMAGE" ] || [ ! -s "$APPIMAGE" ]; then
            echo "::error::El archivo AppImage no existe o pesa 0 bytes: $APPIMAGE"
            exit 1
          fi

          if [ ! -f "$DEB" ] || [ ! -s "$DEB" ]; then
            echo "::error::El archivo .deb no existe o pesa 0 bytes: $DEB"
            exit 1
          fi

          echo "AppImage verificado: $APPIMAGE ($(stat -c%s "$APPIMAGE") bytes)"
          echo ".deb verificado: $DEB ($(stat -c%s "$DEB") bytes)"

      - name: Strict Architecture Verification (Linux x64)
        run: |
          echo "=== Verificación estricta de arquitectura x64 ==="
          RUNNER_ARCH=$(uname -m)
          echo "Arquitectura del runner: $RUNNER_ARCH"
          if [ "$RUNNER_ARCH" != "x86_64" ]; then
            echo "::error::El runner no es x86_64 (es $RUNNER_ARCH)"
            exit 1
          fi

          # Extraer AppImage para inspeccionar binarios internos
          cd dist
          APPIMAGE_FILE="PodcastCraft-AI-1.1.0-linux-x64.AppImage"
          chmod +x "$APPIMAGE_FILE"
          ./"$APPIMAGE_FILE" --appimage-extract
          cd ..

          MAIN_BIN="dist/squashfs-root/podcastcraft-ai"
          FFMPEG_BIN="dist/squashfs-root/resources/backend/node_modules/ffmpeg-static/ffmpeg"

          MAIN_FILE_DESC=$(file "$MAIN_BIN")
          FFMPEG_FILE_DESC=$(file "$FFMPEG_BIN")

          echo "Binario principal: $MAIN_FILE_DESC"
          echo "Binario FFmpeg: $FFMPEG_FILE_DESC"

          if ! echo "$MAIN_FILE_DESC" | grep -q "x86-64"; then
            echo "::error::El binario de Electron no es x86-64: $MAIN_FILE_DESC"
            exit 1
          fi

          if ! echo "$FFMPEG_FILE_DESC" | grep -q "x86-64"; then
            echo "::error::El binario de FFmpeg no es x86-64: $FFMPEG_FILE_DESC"
            exit 1
          fi

          dpkg-deb -I dist/PodcastCraft-AI-1.1.0-linux-x64.deb | grep "Architecture: amd64"
          echo "Arquitectura x64 confirmada en ejecutable, FFmpeg y metadatos de .deb."

      - name: Smoke Test 1 — AppImage (Packaged Binary)
        run: |
          echo "=== Ejecutando Prueba de Humo en AppImage ==="
          APPIMAGE_FILE="dist/PodcastCraft-AI-1.1.0-linux-x64.AppImage"
          xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" \
            node .github/scripts/smoke-test.js \
              --app-path "$APPIMAGE_FILE" \
              --resources-path "dist/squashfs-root/resources" \
              --ffmpeg-path "dist/squashfs-root/resources/backend/node_modules/ffmpeg-static/ffmpeg" \
              --env-path "dist/squashfs-root/resources/backend/.env" \
              --no-sandbox

      - name: Smoke Test 2 — Debian Package (.deb installed)
        run: |
          echo "=== Instalando y ejecutando Prueba de Humo en paquete .deb ==="
          DEB_FILE="dist/PodcastCraft-AI-1.1.0-linux-x64.deb"
          sudo dpkg -i "$DEB_FILE" || sudo apt-get install -f -y

          INSTALLED_BIN=""
          if [ -f "/opt/PodcastCraft AI/podcastcraft-ai" ]; then
            INSTALLED_BIN="/opt/PodcastCraft AI/podcastcraft-ai"
          elif [ -f "/opt/podcastcraft-ai/podcastcraft-ai" ]; then
            INSTALLED_BIN="/opt/podcastcraft-ai/podcastcraft-ai"
          else
            INSTALLED_BIN=$(command -v podcastcraft-ai || true)
          fi

          echo "Ruta de binario instalado: $INSTALLED_BIN"
          if [ -z "$INSTALLED_BIN" ] || [ ! -x "$INSTALLED_BIN" ]; then
            echo "::error::No se encontró el ejecutable instalado del paquete .deb"
            exit 1
          fi

          xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" \
            node .github/scripts/smoke-test.js \
              --app-path "$INSTALLED_BIN" \
              --no-sandbox

          echo "Desinstalando paquete .deb tras prueba exitosa..."
          sudo dpkg -r podcastcraft-ai || true

      - name: Upload Linux Installers Artifact
        uses: actions/upload-artifact@v4
        with:
          name: podcastcraft-linux-x64
          path: |
            dist/PodcastCraft-AI-1.1.0-linux-x64.AppImage
            dist/PodcastCraft-AI-1.1.0-linux-x64.deb
          if-no-files-found: error
          retention-days: 14

      - name: Save Diagnostic Logs (on failure or always)
        if: always()
        run: |
          mkdir -p logs-linux
          dmesg | tail -n 100 > logs-linux/dmesg_tail.txt 2>&1 || true
          dpkg -l | grep -iE 'podcastcraft|fuse|electron' > logs-linux/installed_pkgs.txt 2>&1 || true

      - name: Upload Linux Diagnostic Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: podcastcraft-linux-x64-diagnostics
          path: logs-linux/
          retention-days: 7

  build-macos-arm64:
    name: macOS Apple Silicon (arm64 dmg)
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: System Architecture and Environment Info
        run: |
          echo "=== macOS Apple Silicon Runner Info ==="
          sw_vers
          uname -a
          uname -m
          node -v || true
          npm -v || true

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
