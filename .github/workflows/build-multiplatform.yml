      - name: Install backend dependencies (native ffmpeg-static for macOS arm64)
        run: |
          cd backend
          npm ci
          cd ..

      - name: Validate GEMINI_API_KEY secret and write backend/.env
        env:
          GEMINI_SECRET: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_SECRET" ]; then
            echo "::error::El secret GEMINI_API_KEY no está configurado o está vacío en el repositorio."
            exit 1
          fi
          echo "::add-mask::$GEMINI_SECRET"
          mkdir -p backend
          printf "GEMINI_API_KEY=%s\nGEMINI_MODEL=gemini-2.0-flash\n" "$GEMINI_SECRET" > backend/.env
          chmod 600 backend/.env
          echo "backend/.env configurado correctamente (clave enmascarada)."

      - name: CI Compatibility & Static Syntax Check
        run: |
          echo "Verificando sintaxis de scripts de producción..."
          node --check electron/main.js
          node --check electron/preload.js
          node --check backend/src/server.js
          node --check backend/src/storage.js
          node --check backend/src/routes/auth.js
          node --check backend/src/routes/audio.js
          node --check backend/src/routes/export.js
          node --check backend/src/utils/audioMixer.js
          node --check backend/src/utils/audioTrimmer.js
          node --check .github/scripts/smoke-test.js
          echo "Sintaxis 100% verificada."

      - name: Build macOS Apple Silicon DMG
        run: npm run build:mac:arm64

      - name: Verify build artifact exists and is non-empty
        run: |
          echo "=== Verificando archivos generados en dist/ ==="
          ls -la dist/
          DMG_FILE="dist/PodcastCraft-AI-1.1.0-mac-arm64.dmg"

          if [ ! -f "$DMG_FILE" ] || [ ! -s "$DMG_FILE" ]; then
            echo "::error::El archivo DMG arm64 no existe o pesa 0 bytes: $DMG_FILE"
            exit 1
          fi

          echo "DMG arm64 verificado: $DMG_FILE ($(stat -f%z "$DMG_FILE") bytes)"

      - name: Strict Architecture Verification (macOS arm64)
        run: |
          echo "=== Verificación estricta de arquitectura arm64 ==="
          RUNNER_ARCH=$(uname -m)
          echo "Arquitectura del runner: $RUNNER_ARCH"
          if [ "$RUNNER_ARCH" != "arm64" ]; then
            echo "::error::El runner no es arm64 (es $RUNNER_ARCH)"
            exit 1
          fi

          APP_DIR="dist/mac-arm64/PodcastCraft AI.app"
          if [ ! -d "$APP_DIR" ]; then
            echo "::error::No se encontró el bundle de aplicación en $APP_DIR"
            exit 1
          fi

          MAIN_BIN="$APP_DIR/Contents/MacOS/PodcastCraft AI"
          FFMPEG_BIN="$APP_DIR/Contents/Resources/backend/node_modules/ffmpeg-static/ffmpeg"

          MAIN_FILE_DESC=$(file "$MAIN_BIN")
          FFMPEG_FILE_DESC=$(file "$FFMPEG_BIN")

          echo "Binario principal: $MAIN_FILE_DESC"
          echo "Binario FFmpeg: $FFMPEG_FILE_DESC"

          if ! echo "$MAIN_FILE_DESC" | grep -q "arm64"; then
            echo "::error::El ejecutable de Electron no es arm64: $MAIN_FILE_DESC"
            exit 1
          fi

          if ! echo "$FFMPEG_FILE_DESC" | grep -q "arm64"; then
            echo "::error::El binario de FFmpeg no es arm64: $FFMPEG_FILE_DESC"
            exit 1
          fi

          echo "Arquitectura arm64 confirmada en ejecutable y FFmpeg."

      - name: Smoke Test — macOS Apple Silicon (Packaged App)
        run: |
          echo "=== Ejecutando Prueba de Humo en macOS arm64 ==="
          node .github/scripts/smoke-test.js \
            --app-path "dist/mac-arm64/PodcastCraft AI.app/Contents/MacOS/PodcastCraft AI"

      - name: Upload macOS arm64 Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: podcastcraft-macos-arm64
          path: dist/PodcastCraft-AI-1.1.0-mac-arm64.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Save Diagnostic Logs (on failure or always)
        if: always()
        run: |
          mkdir -p logs-mac-arm64
          syslog -k Sender PodcastCraft > logs-mac-arm64/syslog_podcastcraft.txt 2>&1 || true

      - name: Upload macOS arm64 Diagnostic Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: podcastcraft-macos-arm64-diagnostics
          path: logs-mac-arm64/
          retention-days: 7

